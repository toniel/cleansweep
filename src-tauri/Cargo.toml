[package]
name = "cleansweep"
version = "0.1.0"
description = "CleanSweep — safe, transparent system cleaner for developers"
edition = "2021"
rust-version = "1.85"

[lib]
name = "cleansweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
walkdir = "2"
ignore = "0.4"
rayon = "1.10"
blake3 = "1"
crossbeam-channel = "0.5"
sysinfo = "0.32"
trash = "5"
home = "0.5"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1"
parking_lot = "0.12"
bollard = { version = "0.17", default-features = false }
tokio = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
hyper = { version = "1.3", features = ["client", "http1"] }
http-body-util = "0.1"
log = "0.4"

[target."cfg(unix)".dependencies]
# Direct unix-socket POST for the one endpoint bollard lacks (build/prune).
hyperlocal = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Keep the installer small per PRD non-functional targets
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
